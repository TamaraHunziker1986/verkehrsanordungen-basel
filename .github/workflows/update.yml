name: Kantonsblatt aktualisieren

on:
  schedule:
    # Mittwoch und Samstag, 06:17 und 10:17 UTC (Kantonsblatt erscheint am Morgen)
    - cron: "17 6,10 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen und Seite bauen
        run: python build.py
      - name: Änderungen speichern
        run: |
          git config user.name "kantonsblatt-bot"
          git config user.email "actions@users.noreply.github.com"
          # Jeder Lauf schreibt den Zeitpunkt mit. So gibt es immer einen Commit, und GitHub
          # schaltet den Zeitplan nicht nach 60 Tagen ohne Aktivität ab.
          date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/letzter-lauf.txt
          git add docs cache
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "Update Kantonsblatt $(date +%Y-%m-%d)"
          git push
